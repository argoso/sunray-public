[platformio]
src_dir = .
default_envs = ttgo-lora32

[env:ttgo-lora32]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

lib_deps =
  sandeepmistry/LoRa @ ^0.8.0
  adafruit/Adafruit SSD1306 @ ^2.5.7
  adafruit/Adafruit GFX Library @ ^1.11.11